name: USD/CLP Monthly Retraining & Calibration

on:
  schedule:
    # Día 1 de cada mes a las 06:00 CLT (10:00 UTC)
    - cron: '0 10 1 * *'
  workflow_dispatch: # Permite reentrenamiento manual bajo demanda

permissions:
  contents: write

jobs:
  monthly-retrain:
    name: Full Retraining & Walk-Forward Calibration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Force Retrain Pipeline & Notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NOTIFY_ALERTS: "true"
        run: |
          python usdclp_predictor.py --force-retrain --notify

      - name: Commit & Push Retrained Model and Reports
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add usdclp_model.pkl usdclp_dashboard.png usdclp_report.md usdclp_report.json usdclp_predictions.csv
          if git diff --staged --quiet; then
            echo "No hay cambios para confirmar."
          else
            git commit -m "chore(retrain): Reentrenamiento mensual completo y calibración de pesos [skip ci]"
            git push origin main
          fi
